<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Blog Santiago Morales</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Lora:ital,wght@0,500;0,600;0,700;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/theme.css"/>
<script src="assets/click-spark.js" defer></script>
<style>
  .card-enter { opacity: 0; transform: translateY(24px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .card-enter.visible { opacity: 1; transform: translateY(0); }
</style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- Global site nav -->
<header id="site-nav" class="site-nav">
  <div class="site-nav__bar">
    <a href="index.html" class="site-nav__brand">DavinSane</a>
    <nav aria-label="Main" class="site-nav__links">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="index.html#projects" data-i18n="nav_projects">Projects</a>
      <a href="blog.html" aria-current="page" data-i18n="nav_blog">Blog</a>
    </nav>
    <div class="site-nav__actions">
      <a href="index.html#contact" class="ds-btn ds-btn--sm site-nav__cta"><span data-i18n="nav_cta">Let's talk</span><span class="material-symbols-outlined" aria-hidden="true">arrow_outward</span></a>
      <button id="site-nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav-menu" class="site-nav__toggle">
        <span class="material-symbols-outlined" style="font-size:22px;">menu</span>
      </button>
    </div>
  </div>
  <nav id="site-nav-menu" aria-label="Main" class="site-nav__menu hidden">
    <a href="index.html" data-i18n="nav_home">Home</a>
    <a href="index.html#projects" data-i18n="nav_projects">Projects</a>
    <a href="blog.html" aria-current="page" data-i18n="nav_blog">Blog</a>
    <a href="index.html#contact" class="ds-btn"><span data-i18n="nav_cta">Let's talk</span><span class="material-symbols-outlined" aria-hidden="true">arrow_outward</span></a>
  </nav>
</header>
<script>
  (function () {
    var btn = document.getElementById('site-nav-toggle');
    var menu = document.getElementById('site-nav-menu');
    var icon = btn.querySelector('.material-symbols-outlined');
    function setOpen(open) {
      menu.classList.toggle('hidden', !open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      icon.textContent = open ? 'close' : 'menu';
    }
    btn.addEventListener('click', function () { setOpen(menu.classList.contains('hidden')); });
    menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { setOpen(false); }); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    window.addEventListener('resize', function () { if (window.innerWidth >= 768) setOpen(false); });
  })();
</script>
<!-- Page context: back -->
<div class="border-b border-border-low-contrast">
  <div class="max-w-[1280px] mx-auto px-margin-mobile md:px-16 py-3 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2 text-text-muted hover:text-primary transition-colors duration-200 font-label-sm text-label-sm group">
      <span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform" style="font-size:18px;">arrow_back</span>
      <span data-i18n="nav_back">Back to home</span>
    </a>
    <div class="w-20"></div>
  </div>
</div>

<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-16 py-32">
  <div class="flex flex-col items-center gap-8 text-center max-w-xl card-enter">

    <div class="w-20 h-20 rounded-full border border-border-low-contrast flex items-center justify-center">
      <span class="material-symbols-outlined text-outline-variant" style="font-size:40px;">edit_note</span>
    </div>

    <div>
      <p class="font-label-md text-label-md text-text-muted tracking-widest uppercase mb-4">Blog</p>
      <h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-6 tracking-tight" data-i18n="blog_title">Coming soon</h1>
      <p class="font-body-lg text-body-lg text-text-muted" data-i18n="blog_desc">
        Notes on product design, design systems, and building with AI. The first posts are on their way.
      </p>
    </div>

    <div class="flex items-center gap-3 px-4 py-3 border border-border-low-contrast rounded-sm">
      <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
      <span class="font-label-sm text-label-sm text-text-muted uppercase tracking-widest" data-i18n="blog_status">In progress</span>
    </div>

  </div>
</main>

<footer class="site-footer" data-site-footer></footer>
<script src="assets/site-footer.js"></script>

<!-- Floating language toggle -->
<button id="lang-toggle" onclick="toggleLang()" aria-label="Toggle language" class="lang-toggle">
  <span class="material-symbols-outlined" style="font-size:16px;">language</span>
  <span id="lang-label">ES</span>
</button>

<script>
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.card-enter').forEach(el => observer.observe(el));

  const translations = {
    en: {
      nav_home: 'Home', nav_projects: 'Projects', nav_blog: 'Blog', nav_cta: "Let's talk",
      nav_back: 'Back to home',
      blog_title: 'Coming soon',
      blog_desc: 'Notes on product design, design systems, and building with AI. The first posts are on their way.',
      blog_status: 'In progress',
      footer_copy: '© 2026 Santiago Morales - DavinSane. All rights reserved.',
      footer_privacy: 'Privacy'
    },
    es: {
      nav_home: 'Inicio', nav_projects: 'Proyectos', nav_blog: 'Blog', nav_cta: 'Hablemos',
      nav_back: 'Volver al inicio',
      blog_title: 'Próximamente',
      blog_desc: 'Notas sobre diseño de producto, sistemas de diseño y cómo construir con IA. Los primeros artículos vienen en camino.',
      blog_status: 'En progreso',
      footer_copy: '© 2026 Santiago Morales - DavinSane. Todos los derechos reservados.',
      footer_privacy: 'Privacidad'
    }
  };

  let currentLang = localStorage.getItem('lang') || 'en';

  function applyLang(lang) {
    const t = translations[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (t[key] !== undefined) el.textContent = t[key];
    });
    document.getElementById('lang-label').textContent = lang === 'en' ? 'ES' : 'EN';
    document.documentElement.lang = lang;
  }

  function toggleLang() {
    currentLang = currentLang === 'en' ? 'es' : 'en';
    localStorage.setItem('lang', currentLang);
    applyLang(currentLang);
  }

  applyLang(currentLang);
</script>
</body>
</html>
